<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test yaratish</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .welcome {
            margin: 10px 5px 25px;
        }

        .welcome h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .welcome p {
            margin: 0;
            color: #777;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.07);
        }

        .card h2 {
            margin: 0 0 20px;
            font-size: 20px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .field input,
        .field select {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            background: white;
        }

        .field input:focus,
        .field select:focus {
            border-color: #2481cc;
        }

        .create-button {
            width: 100%;
            height: 55px;
            border: 0;
            border-radius: 14px;
            background: #2481cc;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-button:disabled {
            opacity: 0.6;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 14px;
            text-align: center;
            white-space: pre-line;
        }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            background: white;
            border-top: 1px solid #e5e5e5;
            display: flex;
            justify-content: center;
            gap: 60px;
            align-items: center;
        }

        .nav-button {
            border: 0;
            background: none;
            font-size: 14px;
            color: #555;
            cursor: pointer;
        }

        .nav-icon {
            display: block;
            font-size: 22px;
            margin-bottom: 3px;
        }

        .active {
            color: #2481cc;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="welcome">
        <h1 id="welcomeText">👋 Assalomu alaykum!</h1>
        <p>Yangi test yaratish</p>
    </div>

    <div class="card">

        <h2>➕ Test yaratish</h2>

        <div class="field">
            <label>🔑 Test kodi</label>

            <input
                id="testCode"
                type="text"
                maxlength="10"
                placeholder="Masalan: ABC123"
                autocomplete="off"
            >
        </div>

        <div class="field">
            <label>📢 Test e’lon qilinadigan kanal</label>

            <input
                id="channel"
                type="text"
                placeholder="@kanal_nomi"
                autocomplete="off"
            >
        </div>

        <div class="field">
            <label>⏱️ Test davomiyligi</label>

            <select id="duration">
                <option value="">Tanlang</option>
                <option value="15">15 daqiqa</option>
                <option value="30">30 daqiqa</option>
                <option value="45">45 daqiqa</option>
                <option value="60">60 daqiqa</option>
                <option value="90">90 daqiqa</option>
                <option value="120">120 daqiqa</option>
            </select>
        </div>

        <div class="field">
            <label>📝 Savollar soni</label>

            <select id="questionCount">
                <option value="">Tanlang</option>
                <option value="10">10 ta</option>
                <option value="20">20 ta</option>
                <option value="30">30 ta</option>
                <option value="35">35 ta</option>
                <option value="40">40 ta</option>
                <option value="45">45 ta</option>
            </select>
        </div>

        <button
            id="continueButton"
            class="create-button"
            onclick="continueCreate()">

            Davom etish ➜

        </button>

    </div>

    <div id="message" class="message"></div>

</div>

<div class="bottom-nav">

    <button
        class="nav-button active"
        onclick="goHome()">

        <span class="nav-icon">🏠</span>
        Bosh sahifa

    </button>

    <button
        class="nav-button"
        onclick="goProfile()">

        <span class="nav-icon">👤</span>
        Profil

    </button>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/*
    FLASK SERVER MANZILI

    Hozircha Cloudflare Quick Tunnel.
*/

const API_BASE =
    "https://behavioral-outlined-kim-minimum.trycloudflare.com";
    
/*
    TELEGRAM FOYDALANUVCHISI
*/

const user = tg.initDataUnsafe?.user;

if (user) {

    let name = user.first_name || "";

    if (user.last_name) {
        name += " " + user.last_name;
    }

    document.getElementById("welcomeText").textContent =
        "👋 Assalomu alaykum, " + name + "!";
}


/*
    SERVERDAN PRO HOLATINI OLISH
*/

async function checkProStatus() {

    try {

        const response = await fetch(
            API_BASE + "/api/pro-status",
            {
                method: "GET",
                headers: {
                    "X-Telegram-Init-Data": tg.initData
                }
            }
        );

        const data = await response.json();

        return data;

    } catch (error) {

        console.error("Server xatosi:", error);

        return {
            success: false,
            message: "Server bilan bog‘lanib bo‘lmadi."
        };
    }
}


/*
    DAVOM ETISH
*/

async function continueCreate() {

    const testCode =
        document.getElementById("testCode").value.trim();

    const channel =
        document.getElementById("channel").value.trim();

    const duration =
        document.getElementById("duration").value;

    const questionCount =
        document.getElementById("questionCount").value;

    const button =
        document.getElementById("continueButton");


    /*
        TEST KODI
    */

    if (!testCode) {

        showMessage(
            "❗ Test kodini kiriting."
        );

        return;
    }


    if (
        testCode.length < 4 ||
        testCode.length > 10
    ) {

        showMessage(
            "❗ Test kodi 4–10 ta belgidan iborat bo‘lishi kerak."
        );

        return;
    }


    /*
        KANAL
    */

    if (!channel) {

        showMessage(
            "❗ Test e’lon qilinadigan kanalni kiriting."
        );

        return;
    }


    /*
        DAVOMIYLIGI
    */

    if (!duration) {

        showMessage(
            "❗ Test davomiyligini tanlang."
        );

        return;
    }


    /*
        SAVOLLAR SONI
    */

    if (!questionCount) {

        showMessage(
            "❗ Savollar sonini tanlang."
        );

        return;
    }


    /*
        SERVERNI TEKSHIRISH
    */

    button.disabled = true;
    button.textContent = "Tekshirilmoqda...";


    const proData = await checkProStatus();


    button.disabled = false;
    button.textContent = "Davom etish ➜";


    /*
        SERVER BILAN ALOQA YO‘Q
    */

    if (!proData.success) {showMessage(
            "❌ " + proData.message
        );

        return;
    }


    /*
        PRO TEKSHIRUVI
    */

    if (!proData.pro && !proData.admin) {

        showMessage(
            "⭐ Test yaratish uchun PRO kerak."
        );

        return;
    }


    /*
        HAMMASI TO‘G‘RI
    */

    showMessage(
        "✅ Ma’lumotlar qabul qilindi.\n\n" +
        "Test kodi: " + testCode + "\n" +
        "Kanal: " + channel + "\n" +
        "Davomiyligi: " + duration + " daqiqa\n" +
        "Savollar: " + questionCount + " ta\n\n" +
        "Keyingi bosqichda javoblar kalitini kiritish oynasi ochiladi."
    );

}


/*
    BOSH SAHIFA
*/

function goHome() {

    showMessage(
        "🏠 Siz bosh sahifadasiz."
    );

}


/*
    PROFIL
*/

function goProfile() {

    showMessage(
        "👤 Profil bo‘limi keyingi bosqichda tayyorlanadi."
    );

}


/*
    XABAR
*/

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.display = "block";
}

</script>

</body>
</html>
