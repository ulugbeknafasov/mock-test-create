<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Test yaratish</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .welcome {
            margin: 10px 5px 25px;
        }

        .welcome h1 {
            font-size: 24px;
            margin: 0 0 8px;
        }

        .welcome p {
            margin: 0;
            color: #777;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.07);
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .card p {
            color: #777;
            margin: 0 0 18px;
            line-height: 1.5;
        }

        .create-button {
            width: 100%;
            height: 56px;
            border: 0;
            border-radius: 14px;
            background: #2481cc;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 15px;
            text-align: center;
        }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            height: 70px;

            background: white;
            border-top: 1px solid #e5e5e5;

            display: flex;
            justify-content: center;
            gap: 50px;
            align-items: center;

            z-index: 100;
        }

        .nav-button {
            border: 0;
            background: none;
            font-size: 14px;
            color: #555;
            cursor: pointer;
        }

        .nav-icon {
            display: block;
            font-size: 23px;
            margin-bottom: 3px;
        }

        .active {
            color: #2481cc;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="welcome">
        <h1 id="welcomeText">
            👋 Assalomu alaykum!
        </h1>

        <p>
            Test yaratish platformasiga xush kelibsiz.
        </p>
    </div>


    <div class="card">

        <h2>
            ➕ Test yaratish
        </h2>

        <p>
            O‘zingiz uchun yangi test yarating.
        </p>

        <button
            class="create-button"
            onclick="createTest()">

            ➕ Test yaratish

        </button>

    </div>


    <div id="message" class="message"></div>

</div>


<!-- PASTKI NAVIGATSIYA -->

<div class="bottom-nav">

    <button
        class="nav-button active"
        onclick="goHome()">

        <span class="nav-icon">🏠</span>
        Bosh sahifa

    </button>


    <button
        class="nav-button"
        onclick="goProfile()">

        <span class="nav-icon">👤</span>
        Profil

    </button>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // Telegram foydalanuvchisi

    const user = tg.initDataUnsafe?.user;


    if (user) {

        let name = user.first_name || "";

        if (user.last_name) {
            name += " " + user.last_name;
        }

        document.getElementById("welcomeText").textContent =
            "👋 Assalomu alaykum, " + name + "!";

    }


    // TEST YARATISH

    function createTest() {showMessage(
            "📝 Test yaratish\n\n" +
            "Keyingi bosqichda bu yerda " +
            "test yaratish formasi ochiladi."
        );

    }


    // BOSH SAHIFA

    function goHome() {

        showMessage(
            "🏠 Bosh sahifa"
        );

    }


    // PROFIL

    function goProfile() {

        showMessage(
            "👤 Profil\n\n" +
            "Keyingi bosqichda profilingiz " +
            "shu yerda bo‘ladi."
        );

    }


    // XABAR

    function showMessage(text) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.style.display = "block";

    }

</script>

</body>
</html>
