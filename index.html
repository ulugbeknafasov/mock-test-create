<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Milliy Sertifikat Tekshirish</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111;
        }

        .container {
            max-width: 520px;
            margin: auto;
        }

        .welcome {
            margin: 15px 5px 25px;
        }

        .welcome h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .welcome p {
            margin: 0;
            color: #777;
            font-size: 16px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,.07);
        }

        .card h2 {
            margin: 0 0 22px;
            font-size: 23px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
        }

        .field input,
        .field select {
            width: 100%;
            height: 52px;
            border: 1px solid #ddd;
            border-radius: 13px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        .field input:focus,
        .field select:focus {
            border-color: #2481cc;
        }

        button {
            font-family: inherit;
        }

        .create-button {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 14px;
            background: #2481cc;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-button:disabled {
            opacity: .6;
        }

        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px;
            z-index: 50;
        }

        .nav-button {
            border: 0;
            background: none;
            color: #777;
            font-size: 13px;
            cursor: pointer;
        }

        .nav-button.active {
            color: #2481cc;
            font-weight: bold;
        }

        .nav-icon {
            display: block;
            font-size: 22px;
            margin-bottom: 3px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.58);
            z-index: 100;
            padding: 20px;
            align-items: flex-end;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 25px;
            padding: 23px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 24px;
        }

        .close-button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 50%;
            background: #f1f1f1;
            font-size: 22px;
            cursor: pointer;
        }

        /* =========================
           PROFILE
        ========================= */

        .profile-top {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 82px;
            height: 82px;
            margin: auto;
            border-radius: 50%;
            background: #2481cc;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
        }

        .profile-name {
            margin-top: 12px;
            font-size: 21px;
            font-weight: bold;
        }

        .profile-username {
            margin-top: 5px;
            color: #777;
        }

        .info-card {
            background: #f5f7fa;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .info-title {
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 17px;
            font-weight: bold;
        }

        /* =========================
           PRO CARD
        ========================= */

        .pro-card {
            background: linear-gradient(
                135deg,
                #6d4aff,
                #a855f7
            );
            color: white;
            border-radius: 18px;
            padding: 19px;
            margin-top: 15px;
            margin-bottom: 14px;
        }

        .pro-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .pro-status {
            font-size: 16px;
        }

        .pro-time {
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .pro-button {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 14px;
            background: #6d4aff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* =========================
           PRO PLANS
        ========================= */

        .pro-intro {
            text-align: center;
            color: #666;
            line-height: 1.45;
            margin-bottom: 18px;
        }

        .tariff {
            border: 1px solid #ddd;
            border-radius: 18px;
            padding: 17px;
            margin-bottom: 13px;
            background: white;
        }

        .tariff-title {
            font-size: 19px;
            font-weight: bold;
        }

        .tariff-price {
            color: #2481cc;
            font-size: 24px;
            font-weight: bold;
            margin: 8px 0;
        }

        .tariff-duration {
            color: #777;
            margin-bottom: 13px;
        }

        .tariff-button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 13px;
            background: #2481cc;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 13px;
            background: #eee;
            color: #444;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        /* =========================
           PAYMENT
        ========================= */

        .payment-note {
            background: #fff8df;
            border-radius: 15px;
            padding: 16px;
            line-height: 1.55;
            margin-top: 15px;
        }

        .copy-button {
            width: 100%;
            height: 45px;
            border: 0;
            border-radius: 12px;
            background: #e9e9e9;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message-text {
            text-align: center;
            white-space: pre-line;
            line-height: 1.5;
            margin: 15px 0 20px;
        }

    </style>

</head>


<body>


<div class="container">

         HOME
    ========================= -->

    <div class="card">

<!-- =========================
     BOTTOM NAV
========================= -->

<div class="bottom-nav">

    <button

<!-- =========================

<div

<script>


/* =====================================
   TELEGRAM WEB APP
===================================== */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =====================================
   SERVER MANZILI
===================================== */

const API_BASE =
    "https://metals-java-archive-commitments.trycloudflare.com";


/* =====================================
   TELEGRAM USER
===================================== */

const user =
    tg.initDataUnsafe?.user;


if (user) {

    let fullName =
        user.first_name || "";


    if (user.last_name) {

        fullName +=
            " " + user.last_name;

    }


    document.getElementById(
        "welcomeText"
    ).textContent =
        "👋 Assalomu alaykum, " +
        fullName +
        "!";


    document.getElementById(
        "profileName"
    ).textContent =
        fullName;


    document.getElementById(
        "profileTelegramId"
    ).textContent =
        user.id;


    document.getElementById(
        "profileUsername"
    ).textContent =
        user.username
            ? "@" + user.username
            : "Username mavjud emas";


    document.getElementById(
        "profileAvatar"
    ).textContent =
        (
            user.first_name ||
            "U"
        )
        .charAt(0)
        .toUpperCase();

}


/* =====================================
   PRO STATUS
===================================== */

async function checkProStatus() {

    try {

        const response =
            await fetch(
                API_BASE +
                "/api/pro-status",
                {
                    method: "GET",

                    headers: {
                        "X-Telegram-Init-Data":
                            tg.initData
                    }
                }
            );


        const data =
            await response.json();


        return data;


    } catch (error) {

        console.error(
            "PRO STATUS ERROR:",
            error
        );


        return {

            success: false,

            message:
                "Server bilan bog'lanib bo'lmadi."

        };

    }

}


/* =====================================
   PROFILE
===================================== */

async function goProfile() {

    document
        .getElementById(
            "homeButton"
        )
        .classList.remove("active");


    document
        .getElementById(
            "profileButton"
        )
        .classList.add("active");


    document
        .getElementById(
            "profileModal"
        )
        .classList.add("show");


    await updateProfile();

}


async function updateProfile() {

    const status =
        document.getElementById(
            "profileProStatus"
        );


    const time =
        document.getElementById(
            "profileProTime"
        );


    status.textContent =
        "Tekshirilmoqda...";


    time.textContent =
        "—";


    const data =
        await checkProStatus();


    if (!data.success) {

        status.textContent =
            "❌ Aniqlanmadi";


        time.textContent =
            data.message ||
            "Server xatosi";


        return;

    }


    /* ADMIN */

    if (data.admin) {

        status.textContent =
            "👑 Admin PRO";


        time.textContent =
            "Cheksiz";


        return;

    }


    /* PRO */

    if (data.pro) {

        status.textContent =
            "✅ PRO faol";


        if (data.pro_until) {

            updateRemainingTime(
                data.pro_until
            );

        }


        return;

    }


    /* PRO YO'Q */

    status.textContent =
        "❌ PRO mavjud emas";


    time.textContent =
        "⭐ PRO sotib oling";

}


function updateRemainingTime(
    proUntil
) {

    const timeElement =
        document.getElementById(
            "profileProTime"
        );


    const end =
        new Date(proUntil);


    if (
        window.proTimer
    ) {

        clearInterval(
            window.proTimer
        );

    }


    function update() {

        const now =
            new Date();


        const difference =
            end.getTime() -
            now.getTime();


        if (difference <= 0) {

            timeElement.textContent =
                "PRO muddati tugagan";


            document.getElementById(
                "profileProStatus"
            ).textContent =
                "❌ PRO mavjud emas";


            clearInterval(
                window.proTimer
            );


            return;

        }


        const seconds =
            Math.floor(
                difference / 1000
            );


        const days =
            Math.floor(
                seconds / 86400
            );


        const hours =
            Math.floor(
                (
                    seconds % 86400
                ) / 3600
            );


        const minutes =
            Math.floor(
                (
                    seconds % 3600
                ) / 60
            );


        timeElement.textContent =
            "⏳ " +
            days +
            " kun " +
            hours +
            " soat " +
            minutes +
            " daqiqa qoldi";

    }


    update();


    window.proTimer =
        setInterval(
            update,
            60000
        );

}


function closeProfile() {

    document
        .getElementById(
            "profileModal"
        )
        .classList.remove("show");


    document
        .getElementById(
            "profileButton"
        )
        .classList.remove("active");


    document
        .getElementById(
            "homeButton"
        )
        .classList.add("active");

}


/* =====================================
   PRO TARIFLARINI OLISH
===================================== */

async function openProModal() {

    document
        .getElementById(
            "proModal"
        )
        .classList.add("show");


    const container =
        document.getElementById(
            "proPlans"
        );


    container.innerHTML = `

        <div class="tariff">

            ⏳ Tariflar yuklanmoqda...

        </div>

    `;


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/pro-plans"
            );


        const data =
            await response.json();


        if (!data.success) {

            container.innerHTML = `

                <div class="tariff">

                    ❌ ${
                        data.message ||
                        "Tariflarni yuklab bo'lmadi."
                    }

                </div>

            `;


            return;

        }


        if (
            !Array.isArray(
                data.plans
            ) ||
            data.plans.length === 0
        ) {

            container.innerHTML = `

                <div class="tariff">

                    ❌ Hozircha PRO tariflari mavjud emas.

                </div>

            `;


            return;

        }


        container.innerHTML = "";


        data.plans.forEach(
            function(plan) {

                const tariff =
                    document.createElement(
                        "div"
                    );


                tariff.className =
                    "tariff";


                const price =
                    Number(
                        plan.price
                    )
                    .toLocaleString(
                        "uz-UZ"
                    );


                tariff.innerHTML = `

                    <div class="tariff-title">

                        ⭐ PRO —
                        ${plan.duration_days} kun

                    </div>


                    <div class="tariff-price">

                        ${price} so'm

                    </div>


                    <div class="tariff-duration">

                        ${plan.duration_days}
                        kun davomida PRO

                    </div>


                    <button
                        class="tariff-button"
                        onclick="buyPro(${Number(plan.id)})"
                    >

                        ⭐ PRO sotib olish

                    </button>

                `;


                container.appendChild(
                    tariff
                );

            }
        );


    } catch (error) {

        console.error(
            "PRO PLANS ERROR:",
            error
        );


        container.innerHTML = `

            <div class="tariff">

                ❌ Server bilan bog'lanib bo'lmadi.

                <br><br>

                Server ishlayotganini tekshiring.

            </div>

        `;

    }

}


function closeProModal() {

    document
        .getElementById(
            "proModal"
        )
        .classList.remove("show");

}


/* =====================================
   PRO SOTIB OLISH
===================================== */

async function buyPro(planId) {

    const container =
        document.getElementById(
            "proPlans"
        );


    container.innerHTML = `

        <div class="tariff">

            ⏳ To'lov ma'lumotlari
            tayyorlanmoqda...

        </div>

    `;


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/pro-purchase",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Telegram-Init-Data":
                            tg.initData

                    },

                    body:
                        JSON.stringify({

                            plan_id:
                                Number(planId)

                        })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            closeProModal();


            showMessage(
                "❌ " +
                (
                    data.message ||
                    "To'lovni boshlashda xatolik."
                )
            );


            return;

        }


        const payment =
            data.payment;


        if (!payment) {

            closeProModal();


            showMessage(
                "❌ Server to'lov ma'lumotlarini yubormadi."
            );


            return;

        }


        const card =
            payment.card || {};


        const amount =
            Number(
                payment.amount || 0
            );


        const paymentId =
            payment.id;


        const duration =
            payment.duration_days;


        const cardNumber =
            card.card_number ||
            "Karta mavjud emas";


        const cardHolder =
            card.card_holder ||
            "—";


        const bankName =
            card.bank_name ||
            "—";


        closeProModal();


        document.getElementById(
            "paymentContent"
        ).innerHTML = `

            <div class="info-card">

                <div class="info-title">
                    🆔 To'lov ID
                </div>

                <div class="info-value">

                    #${paymentId}

                </div>

            </div>


            <div class="info-card">

                <div class="info-title">
                    ⭐ Tarif
                </div>

                <div class="info-value">

                    ${duration} kun

                </div>

            </div>


            <div class="info-card">

                <div class="info-title">
                    💰 To'lov summasi
                </div>

                <div class="info-value">

                    ${amount.toLocaleString("uz-UZ")}
                    so'm

                </div>

            </div>


            <div class="info-card">

                <div class="info-title">
                    💳 Karta raqami
                </div>

                <div
                    class="info-value"
                    style="
                        word-break:break-all;
                        font-size:18px;
                    "
                >

                    ${escapeHtml(cardNumber)}

                </div>


                <button
                    class="copy-button"
                    onclick="copyCard()"
                >

                    📋 Karta raqamini nusxalash

                </button>

            </div>


            <div class="info-card">

                <div class="info-title">
                    👤 Karta egasi
                </div>

                <div class="info-value">

                    ${escapeHtml(cardHolder)}

                </div>

            </div>


            <div class="info-card">

                <div class="info-title">
                    🏦 Bank
                </div>

                <div class="info-value">

                    ${escapeHtml(bankName)}

                </div>

            </div>


            <div class="payment-note">

                <b>📌 To'lov tartibi</b>

                <br><br>

                1️⃣ Kartaga

                <b>
                    ${amount.toLocaleString("uz-UZ")}
                    so'm
                </b>

                o'tkazing.

                <br><br>

                2️⃣ To'lov chekini
                <b>botga yuboring.</b>

                <br><br>

                3️⃣ Admin chekni tekshiradi.

                <br><br>

                4️⃣ Admin tasdiqlagandan keyin
                PRO avtomatik faollashadi.

                <br><br>

                🆔 To'lov ID:
                <b>#${paymentId}</b>

            </div>


            <button
                class="create-button"
                style="margin-top:15px;"
                onclick="returnToBot()"
            >

                📤 Botga qaytish

            </button>


            <button
                class="cancel-button"
                onclick="closePaymentModal()"
            >

                Keyinroq

            </button>

        `;


        window.currentCardNumber =
            cardNumber;


        document
            .getElementById(
                "paymentModal"
            )
            .classList.add("show");


    } catch (error) {

        console.error(
            "PRO PURCHASE ERROR:",
            error
        );


        closeProModal();


        showMessage(
            "❌ Server bilan bog'lanib bo'lmadi."
        );

    }

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}


/* =====================================
   KARTA NUSXALASH
===================================== */

async function copyCard() {

    const cardNumber =
        window.currentCardNumber;


    if (!cardNumber) {

        return;

    }


    try {

        await navigator
            .clipboard
            .writeText(
                cardNumber
            );


        showMessage(
            "✅ Karta raqami nusxalandi!"
        );


    } catch (error) {

        showMessage(
            "📋 Karta raqamini qo'lda nusxalang."
        );

    }

}


/* =====================================
   PAYMENT MODAL YOPISH
===================================== */

function closePaymentModal() {

    document
        .getElementById(
            "paymentModal"
        )
        .classList.remove("show");

}


/* =====================================
   BOTGA QAYTISH
===================================== */

function returnToBot() {

    closePaymentModal();


    showMessage(
        "📤 Mini App yopiladi.\n\n" +
        "Botga qaytgach, to'lov chekini " +
        "rasm yoki fayl ko'rinishida yuboring.\n\n" +
        "Admin tekshiradi va tasdiqlaydi."
    );


    setTimeout(
        function() {

            tg.close();

        },
        1300
    );

}


/* =====================================
   TEST YARATISH
===================================== */

async function continueCreate() {

    const testCode =
        document.getElementById(
            "testCode"
        ).value.trim();


    const channel =
        document.getElementById(
            "channel"
        ).value.trim();


    const duration =
        document.getElementById(
            "duration"
        ).value;


    const questionCount =
        document.getElementById(
            "questionCount"
        ).value;


    const button =
        document.getElementById(
            "continueButton"
        );


    if (!testCode) {

        showMessage(
            "❗ Test kodini kiriting."
        );

        return;

    }


    if (
        testCode.length < 4 ||
        testCode.length > 10
    ) {

        showMessage(
            "❗ Test kodi 4–10 belgidan iborat bo'lishi kerak."
        );

        return;

    }


    if (!channel) {

        showMessage(
            "❗ Test e'lon qilinadigan kanalni kiriting."
        );

        return;

    }


    if (!duration) {

        showMessage(
            "❗ Test davomiyligini tanlang."
        );

        return;

    }


    if (!questionCount) {

        showMessage(
            "❗ Savollar sonini tanlang."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Tekshirilmoqda...";


    const proData =
        await checkProStatus();


    button.disabled = false;

    button.textContent =
        "Davom etish ➜";


    if (!proData.success) {

        showMessage(
            "❌ " +
            (
                proData.message ||
                "Server xatosi."
            )
        );

        return;

    }


    if (
        !proData.pro &&
        !proData.admin
    ) {

        await openProModal();

        return;

    }


    showMessage(

        "✅ PRO faol!\n\n" +

        "🔑 Test kodi: " +
        testCode +

        "\n📢 Kanal: " +
        channel +

        "\n⏱ Davomiyligi: " +
        duration +
        " daqiqa" +

        "\n📝 Savollar: " +
        questionCount +
        " ta"

    );

}


/* =====================================
   HOME
===================================== */

function goHome() {

    document
        .getElementById(
            "homeButton"
        )
        .classList.add("active");


    document
        .getElementById(
            "profileButton"
        )
        .classList.remove("active");


    closeProfile();
    closeProModal();
    closePaymentModal();


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text
) {

    document.getElementById(
        "messageText"
    ).textContent =
        text;


    document.getElementById(
        "messageModal"
    ).classList.add("show");

}


function closeMessage() {

    document.getElementById(
        "messageModal"
    ).classList.remove("show");

}


/* =====================================
   MODAL OUTSIDE CLICK
===================================== */

document
    .getElementById(
        "profileModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeProfile();

            }

        }
    );


document
    .getElementById(
        "proModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeProModal();

            }

        }
    );


document
    .getElementById(
        "paymentModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closePaymentModal();

            }

        }
    );


document
    .getElementById(
        "messageModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeMessage();

            }

        }
    );

</script>
